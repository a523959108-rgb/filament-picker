# Example snippet inside the existing filament server block; do not deploy blindly.
# Match FILAMENT_PICKER_MODELS_ROOT, including the trailing slash on alias.
# Authenticated GLBs use the same internal alias: /internal-models/meshes/<id>.glb.
# Do not add a public location for meshes/ or for original .3mf files.
location ^~ /internal-models/ {
    internal;
    alias /srv/filament-picker/models/private/;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Always send model pages and APIs to the application for authentication.
# These locations must take precedence over any static SPA fallback or image rules.
location = /models {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}
location ^~ /models/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}
location = /api/models {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}
location ^~ /api/models/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}
location = /robots.txt {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/proxy_params;
}
