# filament-picker static asset gzip + cache — apply on server B by 运维助手.
# Do NOT deploy from this PR automatically. Review + reload nginx after backup.
#
# Baseline (2026-11-07 Asia/Shanghai measurements from box):
#   web-catalog.json  2,547,899 bytes (~2.43 MiB), ~7–8s TTFB+download, NO Content-Encoding
#   gzip -9 estimate    ~139,668 bytes (~0.13 MiB)  ≈ 18× smaller
#   JS bundle           307,017 bytes, also uncompressed today
#   SKU thumbs          ~9–15 KiB each; grid already uses loading="lazy"
#
# Suggested snippets (merge into the filament.ibaozi.com server block):

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/json
  application/javascript
  text/css
  text/plain
  image/svg+xml;
gzip_vary on;

# Long-cache fingerprinted Vite assets; short/revalidate for the catalog JSON.
location /assets/ {
  expires 7d;
  add_header Cache-Control "public, max-age=604800, immutable";
  try_files $uri =404;
}

location = /web-catalog.json {
  expires 5m;
  add_header Cache-Control "public, max-age=300, must-revalidate";
  # gzip handled globally above
}

location /sku/ {
  expires 7d;
  add_header Cache-Control "public, max-age=604800";
  try_files $uri =404;
}
