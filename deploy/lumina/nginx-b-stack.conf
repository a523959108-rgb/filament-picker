# 仅用于 B；替换 stack.filament.ibaozi.com 原 302 server 块，不能与旧块并存。
# 回滚：变更前备份原 302 所在配置文件到 nginx include 目录以外；
# 恢复原文件，同时移除本文件的 upstream/新 server 与新增 zone 配置；
# 执行 nginx -t，成功后 systemctl reload nginx。
# 本文件放在 http {} 直接 include 的 sites-enabled 或 conf.d。
# 主力 zhou-mini-gtx docker 的 Tailscale 发布端口。
upstream lumina_backend {
    server 100.90.12.104:7860 max_fails=2 fail_timeout=30s;
    server 100.121.76.35:8790 max_fails=2 fail_timeout=30s backup;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name stack.filament.ibaozi.com;

    # 证书：从 B 现有 stack.filament.ibaozi.com 的 server 块原样复制 ssl_certificate /
    # ssl_certificate_key（以及 include 的 ssl 片段、listen 写法），不要新签或改路径。
    # 运维可执行：sudo nginx -T 2>/dev/null | grep -A30 'server_name stack.filament.ibaozi.com'
    # 下面两行占位必须替换，否则 nginx -t 会失败（这是有意的安全阀）。
    ssl_certificate __FROM_EXISTING_STACK_BLOCK__/fullchain.pem;
    ssl_certificate_key __FROM_EXISTING_STACK_BLOCK__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    limit_req_status 429;
    limit_req zone=lumina_general burst=30 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    # 上游使用普通 HTTP 和 /api/jobs/{id} 长轮询，未注册 SSE/WebSocket 路由。
    # 清空 Connection 保持 upstream keepalive，不臆加 Upgrade。
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # 不加 non_idempotent：POST 已发送给主力后不自动重放，避免重复生成。
    # 连接建立失败且尚未发送请求时可试备机；会话/任务/文件缓存仍不共享。

    # 上传、预览和生成等写操作使用更严格的按 IP 限流；GET 同路径也受此限制。
    location ~ ^/api/(convert/|calibration/|extractor/|vectorize/|lut/(upload|merge)|projects/) {
        limit_req zone=lumina_general burst=30 nodelay;
        limit_req zone=lumina_compute burst=2 nodelay;
        proxy_pass http://lumina_backend;
    }

    # 长轮询及时返回任务结果；不缓冲，不缓存。
    location /api/jobs/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://lumina_backend;
    }

    # 前端 dist 与全部 API 在同一个子域根路径，保持原路径传递。
    location / {
        proxy_pass http://lumina_backend;
    }
}

server {
    listen 80;
    server_name stack.filament.ibaozi.com;
    return 301 https://$host$request_uri;
}
