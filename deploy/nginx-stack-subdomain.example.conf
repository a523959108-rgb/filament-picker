# EXAMPLE ONLY — do not apply until 志远 says「现在部署」.
# Subdomain for 叠色: stack.filament.ibaozi.com
# Main catalog stays on filament.ibaozi.com (unchanged).
#
# Strategy: serve the SAME web/dist as the main site (or a copy),
# and land visitors on /#/stack. Main homepage button already links here.
#
# DNS: A/AAAA (or CNAME) for stack.filament.ibaozi.com → same edge as main.
# TLS: include this name in the existing cert / issue a new one before reload.

server {
  listen 443 ssl http2;
  server_name stack.filament.ibaozi.com;

  # reuse the same cert paths / include as filament.ibaozi.com
  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  # Point at the same static root the main site uses, OR a dedicated copy
  # of web/dist from the same release. Do NOT change the main server_name block.
  root /path/to/filament-picker/web/dist;
  index index.html;

  # Land bare / on the in-app stack route (SPA hash).
  location = / {
    return 302 /#/stack;
  }

  # Same gzip/cache habits as main (see nginx-static-assets.example.conf).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_vary on;

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location = /web-catalog.json {
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri =404;
  }

  location /sku/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /stack-smoke/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # SPA fallback for any non-file path (hash route still client-side).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: if /api/plan should work from the subdomain too, mirror the
  # main site's proxy_pass snippet here. Otherwise leave API on the main host.
}

server {
  listen 80;
  server_name stack.filament.ibaozi.com;
  return 301 https://$host$request_uri;
}
